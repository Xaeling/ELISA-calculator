# 单文件发布配置：把 C/C++ 运行库静态链接进 exe，目标机器无需安装 VC++ Redist。
#
# 用法：
#   MSVC 工具链（rustup 默认）：直接 `cargo build --release`，下面第一段生效。
#   GNU 工具链：先 rustup target add x86_64-pc-windows-gnu 并安装 mingw-w64，
#               `cargo build --release --target x86_64-pc-windows-gnu`，
#               通常也会静态链接 CRT；若仍有 libgcc_*.dll 依赖，把第二段注释打开。

[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

# [target.x86_64-pc-windows-gnu]
# rustflags = ["-C", "link-args=-static -static-libgcc -static-libstdc++"]
